# בדיקות יחידה על כל דחיפה ובקשת משיכה. הבדיקות עובדות עם seforim.db מדומה, בלי רשת.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: הרצת הבדיקות
        env:
          PYTHONIOENCODING: utf-8
        run: python -X utf8 -m unittest discover -s tests -v
